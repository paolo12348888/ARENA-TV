name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: |
          echo "File presenti nel repository:"
          ls -la
          if ! ls ./*.zip >/dev/null 2>&1; then
            echo "ERRORE: nessun file .zip trovato nel repository"
            exit 1
          fi
          mkdir -p proj
          for f in ./*.zip; do unzip -o "$f" -d proj; done
          echo "Contenuto estratto:"
          find proj -maxdepth 3 | head -50

      - name: Build debug APK
        run: |
          S=$(find proj -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then
            echo "ERRORE: settings.gradle.kts non trovato nello zip"
            exit 1
          fi
          D=$(dirname "$S")
          echo "Cartella progetto: $D"
          cd "$D"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: proj/**/app/build/outputs/apk/debug/app-debug.apk
